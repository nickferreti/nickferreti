name: Stats cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/cards.py, .github/workflows/cards.yml]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: metrics
          path: out

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Personal token so private and organization contributions are counted.
      - name: Render cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/cards.py "${{ github.repository_owner }}" out

      - name: Publish
        working-directory: out
        run: |
          git rm -q --ignore-unmatch metrics.svg prs-*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats-*.svg langs-*.svg
          git diff --cached --quiet || { git commit -m "chore: update stats cards" && git push; }
