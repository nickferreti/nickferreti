name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Personal token so private and organization contributions are counted.
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          # Own branch: the snake workflow force-pushes `output`.
          committer_branch: metrics
          user: nickferreti
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, dockerfile, shell, makefile
          plugin_languages_sections: most-used

      # Metrics reads pull requests from the contributions calendar, where
      # organization work is restricted; search sees them with the same token.
      - uses: actions/checkout@v4
        with:
          ref: metrics

      - name: Count pull requests
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          count() { gh api "search/issues?q=$1&per_page=1" --jq .total_count; }
          badge() { printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' "$1" "$2" "$3" > "$4"; }
          badge "PRs opened" "$(count 'is:pr+author:nickferreti')" "4F46E5" prs-opened.json
          badge "PRs merged" "$(count 'is:pr+author:nickferreti+is:merged')" "06B6D4" prs-merged.json
          badge "PRs reviewed" "$(count 'is:pr+reviewed-by:nickferreti+-author:nickferreti')" "818CF8" prs-reviewed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prs-*.json
          git diff --cached --quiet || { git commit -m "chore: update pull request counts" && git push; }
