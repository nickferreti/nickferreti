name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#4F46E5&color_dots=#EBEDF0,#C7D2FE,#818CF8,#4F46E5,#312E81
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#06B6D4&color_dots=#161B22,#1E3A8A,#3730A3,#4F46E5,#818CF8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
