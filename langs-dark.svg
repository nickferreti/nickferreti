<svg xmlns="http://www.w3.org/2000/svg" width="350" height="225" viewBox="0 0 350 225" fill="none" role="img" aria-labelledby="title">
  <title id="title">Most Used Languages</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #818CF8; animation: fadeIn 0.8s ease-in-out forwards; }
    .stat { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #C9D1D9; }
    .bold { font-weight: 700; }
    .icon { fill: #06B6D4; }
    .lang { font: 600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #C9D1D9; }
    .stagger { opacity: 0; animation: fadeIn 0.3s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0s !important; animation-delay: 0s !important; } }
    .grow { animation: grow 0.6s ease-in-out forwards; }
    @keyframes grow { from { width: 0; } }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="349" height="224" fill="#0D1117" />
  <text x="25" y="35" class="header">Most Used Languages</text>
  <g class="stagger" style="animation-delay: 450ms" transform="translate(25, 55)">
    <text class="lang" y="12">Python</text>
    <text class="lang" x="300" y="12" text-anchor="end">77.78%</text>
    <rect y="20" rx="4" width="275" height="8" fill="#4F46E5" fill-opacity="0.15" />
    <svg class="grow" y="20" width="213.89" height="8"><rect rx="4" width="100%" height="8" fill="#3572A5" /></svg>
  </g>
  <g class="stagger" style="animation-delay: 600ms" transform="translate(25, 95)">
    <text class="lang" y="12">TypeScript</text>
    <text class="lang" x="300" y="12" text-anchor="end">19.54%</text>
    <rect y="20" rx="4" width="275" height="8" fill="#4F46E5" fill-opacity="0.15" />
    <svg class="grow" y="20" width="53.73" height="8"><rect rx="4" width="100%" height="8" fill="#3178C6" /></svg>
  </g>
  <g class="stagger" style="animation-delay: 750ms" transform="translate(25, 135)">
    <text class="lang" y="12">JavaScript</text>
    <text class="lang" x="300" y="12" text-anchor="end">2.11%</text>
    <rect y="20" rx="4" width="275" height="8" fill="#4F46E5" fill-opacity="0.15" />
    <svg class="grow" y="20" width="8.00" height="8"><rect rx="4" width="100%" height="8" fill="#F1E05A" /></svg>
  </g>
  <g class="stagger" style="animation-delay: 900ms" transform="translate(25, 175)">
    <text class="lang" y="12">Vue</text>
    <text class="lang" x="300" y="12" text-anchor="end">0.58%</text>
    <rect y="20" rx="4" width="275" height="8" fill="#4F46E5" fill-opacity="0.15" />
    <svg class="grow" y="20" width="8.00" height="8"><rect rx="4" width="100%" height="8" fill="#41B883" /></svg>
  </g>
</svg>
